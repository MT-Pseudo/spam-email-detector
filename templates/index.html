<!doctype html>
<html lang="en">
<head>
  <title>Spam Detector</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0d10; --sidebar-bg: #111116; --panel-bg: #16161c;
      --border: #2a2a35; --accent: #7c6fef; --text: #e8e8f0;
      --muted: #6b6b80; --spam-red: #ff5e5e; --ok-green: #4eca7f;
      --input-bg: #1a1a22; --tag-bg: #1e1e28; --radius: 10px;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
    .sidebar { width: 240px; min-width: 240px; background: var(--sidebar-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 28px 20px 24px; }
    .logo-icon { width: 36px; height: 36px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; margin-bottom: 14px; }
    .logo-icon svg { width: 18px; height: 18px; fill: #fff; }
    .sidebar h1 { font-family: 'Space Mono', monospace; font-size: 18px; font-weight: 700; margin-bottom: 6px; }
    .tagline { font-size: 12px; color: var(--muted); line-height: 1.5; margin-bottom: 28px; }
    .sidebar-divider { border: none; border-top: 1px solid var(--border); margin: 0 0 20px; }
    .sidebar-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); font-weight: 600; margin-bottom: 10px; }
    .stats-group { display: flex; flex-direction: column; gap: 8px; }
    .stat-row { display: flex; justify-content: space-between; align-items: center; background: var(--input-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 9px 14px; font-size: 13px; }
    .stat-badge { width: 22px; height: 22px; border-radius: 50%; background: var(--tag-bg); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; font-family: 'Space Mono', monospace; }
    .stat-badge.red { background: rgba(255,94,94,0.12); border-color: rgba(255,94,94,0.4); color: var(--spam-red); }
    .stat-badge.green { background: rgba(78,202,127,0.12); border-color: rgba(78,202,127,0.4); color: var(--ok-green); }
    .main { flex: 1; display: flex; align-items: flex-start; justify-content: center; padding: 40px 48px; overflow-y: auto; }
    .card { background: var(--panel-bg); border: 1px solid var(--border); border-radius: 14px; padding: 32px 36px; width: 100%; max-width: 860px; }
    .field-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); font-weight: 600; margin-bottom: 8px; }
    .text-input { width: 100%; background: var(--input-bg); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px; padding: 12px 16px; outline: none; transition: border-color 0.2s; margin-bottom: 20px; }
    .text-input:focus { border-color: var(--accent); }
    .text-input::placeholder { color: var(--muted); }
    textarea.text-input { resize: vertical; min-height: 160px; line-height: 1.6; }
    .analyze-btn { width: 100%; background: var(--accent); border: none; border-radius: var(--radius); color: #fff; font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600; padding: 14px; cursor: pointer; transition: background 0.2s; }
    .analyze-btn:hover { background: #9488f5; }
    .result-panel { margin-top: 24px; background: var(--input-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 24px; }
    .result-header { display: flex; align-items: center; justify-content: space-between; }
    .verdict { font-family: 'Space Mono', monospace; font-size: 22px; font-weight: 700; }
    .verdict.spam { color: var(--spam-red); }
    .verdict.ham { color: var(--ok-green); }
    .prob-pill { font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 20px; }
    .prob-pill.spam { background: rgba(255,94,94,0.12); color: var(--spam-red); border: 1px solid rgba(255,94,94,0.3); }
    .prob-pill.ham { background: rgba(78,202,127,0.12); color: var(--ok-green); border: 1px solid rgba(78,202,127,0.3); }
  </style>
</head>
<body>

<aside class="sidebar">
  <div class="logo-icon">
    <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4V8l8 5 8-5v10zm-8-7L4 6h16l-8 5z"/></svg>
  </div>
  <h1>Spam Detector</h1>
  <p class="tagline">ML-powered email spam detection using Logistic Regression + TF-IDF.</p>
  <hr class="sidebar-divider" />
  <div class="sidebar-label">Stats</div>
  <div class="stats-group">
    <div class="stat-row">Model <span style="font-size:11px;color:var(--ok-green);font-weight:600">&#9679; Active</span></div>
    <div class="stat-row">Spam <span class="stat-badge red">&#10007;</span></div>
    <div class="stat-row">Legitimate <span class="stat-badge green">&#10003;</span></div>
  </div>
</aside>

<main class="main">
  <div class="card">
    <form method="POST" onsubmit="return validateForm();">
      <div class="field-label">Subject Line (Optional)</div>
      <input class="text-input" type="text" name="subject" placeholder="e.g. You've won a prize!" />

      <div class="field-label">Email Body</div>
      <textarea id="emailText" name="email" class="text-input" placeholder="Paste your email content here&#8230;" required></textarea>

      <button type="submit" class="analyze-btn">Detect Spam</button>
    </form>

    {% if result %}
    <div class="result-panel">
      <div class="result-header">
        <div class="verdict {% if result == 'SPAM' %}spam{% else %}ham{% endif %}">
          {% if result == 'SPAM' %}&#128680;{% else %}&#9989;{% endif %} {{ result }}
        </div>
        <span class="prob-pill {% if result == 'SPAM' %}spam{% else %}ham{% endif %}">
          Likely spam: {{ probability }}
        </span>
      </div>
    </div>
    {% endif %}

  </div>
</main>

<script>
function validateForm() {
  if (!document.getElementById('emailText').value.trim()) {
    alert('Please paste the email text before detecting spam.');
    return false;
  }
  return true;
}
</script>
</body>
</html>
